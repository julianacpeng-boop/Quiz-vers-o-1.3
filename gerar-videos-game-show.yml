name: Gerar 8 videos JuhQuiz Game Show

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar FFmpeg e fontes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation2 fontconfig

      - name: Instalar bibliotecas Python
        run: pip install -r requirements.txt

      - name: Gerar 8 videos Game Show
        run: python -u gerar_videos_game_show.py

      - name: Guardar os MP4 no GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JUH-QUIZ-GAME-SHOW-${{ github.run_number }}
          path: output_game_show/**/*.mp4
          if-no-files-found: warn
          retention-days: 7
